# 机工士职业配置。
# 口径：国际服 Patch 7.5、Lv.100 PvE；首批收录机工基础循环与完整野火，不实现 Queen。
job:
  key: machinist
  name: 机工士

timing:
  combo_duration: 30.0
  wildfire_duration: 10.0
  wildfire_potency_per_hit: 240.0
  default_fight_remaining: 600.0

resources:
  # 资源上限由职业配置提供，状态机只负责按这些上限归一化和统计溢出。
  heat:
    max_value: 100
  battery:
    max_value: 100
  combo_stage:
    max_value: 2
  combo_remaining:
    max_value: 30
  wildfire_active:
    max_value: 1
  # 上限必须与 timing.wildfire_duration 一致；配置加载器会 fail-fast 校验，避免
  # duration 变更后通用资源归一化仍按旧上限静默截断。
  wildfire_remaining:
    max_value: 10
  wildfire_hits:
    max_value: 6

statuses:
  overheated:
    # 本地语义状态 ID；真实日志状态 ID 待 FFLogs 样本复核。
    game_id: 2000001
    duration: 10.0
    max_stacks: 5
  free_hypercharge:
    game_id: 2000002
    duration: 30.0
    max_stacks: 1
  full_metal_machinist:
    game_id: 2000003
    duration: 30.0
    max_stacks: 1
  reassemble:
    game_id: 851
    duration: 5.0
    max_stacks: 1
  excavator_ready:
    game_id: 2000004
    duration: 30.0
    max_stacks: 1

skills:
  # value 是训练辅助值；职业状态机可按运行时状态解析它，整备使下一个符合条件的武器技能 value 提升为 2.00。
  # 整备是给后续技能的状态，是否触发保证命中由状态机按当前状态判断，不提高整备自身的 value。
  heated_split_shot:
    game_id: 7411
    name: 热分裂弹
    kind: gcd
    behavior: mch_combo_one
    potency: 220
    value: 1.00
    cast_time: 0.0
    recast_time: 2.5
    requires_target: true
    tags: [weaponskill, single_target_weaponskill, combo, filler]
