# 黑魔 Artzip 模型契约。
# 数据/输出路径、模型架构和运行精度属于同一份模型参数配置。

# ------------------------------
# 数据与输出
# ------------------------------

# 转换、训练、GRPO、模型分析和自回归回放共用的输入根目录；只读取已评估 JSON，不向该目录写入转换结果。
# 离线评估入口会从同级 raw 读取原始文件，避免把 annotated 再次当作输入。
raw_data_dir: data/human/job/black_mage/annotated

# checkpoint、训练日志和最终模型的主线输出目录；所有当前模型变体共用该目录。
output_dir: artifacts/checkpoints/black_mage/artzip_bc

# 模型权重精度；分析、回放、GRPO 和导出共用这一项，不允许按输出拆分。
# 黑魔当前使用 bf16，要求 CUDA 设备；输入 cache 仍保持 float32。
precision: bf16

# ------------------------------
# 模型架构
# ------------------------------

model:
  # Transformer token 的主维度；必须能被 n_heads 整除。
  d_model: 384

  # Transformer 编码层数。
  n_layers: 6

  # 注意力头数量；d_model 必须能被该值整除。
  n_heads: 6

  # K/V 头数量；1 表示 MQA，可改为 n_heads 的合法因数做 GQA。
  num_kv_heads: 1

  # Q 的低秩中间宽度；先投影并执行可学习 RMSNorm，再投影为全部 Q 头。
  # K/V 共用一组投影和可学习 RMSNorm；两处 epsilon 均为 1e-20，归一化后执行 RoPE。
  q_lora_rank: 96

  # FFN 隐藏宽度；SwiGLU 的门控投影会按模型实现使用对应内部宽度。
  ff_dim: 1536

  # Transformer 每层采用 Pre-Norm；子层及最终输出使用可学习 RMSNorm，γ 初始化为全 1、eps 为 1e-20。
  # 在 FP32 中统计并归一化，乘 γ 后恢复输入 dtype；输入 token 与 Q/K 的归一化独立保持。
  transformer_norm_first: true

  # Transformer 主干 FFN 激活：gelu / relu / swiglu；
  # 切换后需要重新训练。
  transformer_activation: swiglu

  # SwiGLU 在 FP32 中将 up 裁剪至 [-limit, limit]，gate 在 SiLU 前仅裁剪上界。
  swiglu_limit: 10.0

  # false 使用四路 Hyper-Connections；true 使用独立的 Full AttnRes 深度聚合。
  full_attention_residuals: false

  # attention 与 FFN 各自计算动态 pre/post/残差混合；pre 交给下一子层使用。
  # 残差混合矩阵使用 Sinkhorn 归一化；Full AttnRes 不创建 HC 参数。
  hc_mult: 4
  hc_sinkhorn_iters: 20
  hc_eps: 1e-6

  # Transformer 的 dropout 概率。
  dropout: 0.1

  # RoPE 的基础频率参数。
  rope_theta: 10000.0

  # 独立无 bias 动作输出头；初始化复制技能 embedding 的动作行，后续独立训练。
  # 输出分数以 FP32 执行 s*tanh(logits/s)，之后再执行重复惩罚和宿主合法性过滤。
  logit_softcap: 15.0

  # 场景、历史状态/动作和当前状态共用的 token 总容量。
  context_capacity: 1024

  # 历史超出容量时保留最近这些动作，再重新累积；仅影响读取，不改变完整 raw bank。
  history_reset_keep: 8

  # 相对时间与绝对时长分别使用 config/policy/normalizer.yaml 的 time_scale 与 duration_scale。
