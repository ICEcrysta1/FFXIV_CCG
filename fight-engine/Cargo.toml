[package]
name = "fight-engine"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
license-file = "../LICENSE"

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml_ng = "0.10"
unsafe-libyaml = "0.2"
